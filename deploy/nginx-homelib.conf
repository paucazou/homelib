# Homelib, served on port 8888.
#
# Port 8888 rather than a path under the existing site for two reasons: the
# thermometer already owns port 80 as the default server, and the desktop
# client (dbupdater.py) has always looked for http://palantir:8888/ -- keeping
# that address means the PyQt program keeps syncing with no change at all.

server {
    listen 8888;
    listen [::]:8888;
    server_name _;

    # The catalogue is 1.2 MB of JSON and compresses to about 200 KB, which is
    # the difference between instant and sluggish over house wifi.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    # text/javascript as well as application/javascript: Flask sends the former
    # for .js, and listing only the latter left the 76 KB script uncompressed.
    gzip_types application/json application/javascript text/javascript
               application/manifest+json text/css text/plain image/svg+xml;

    client_max_body_size 4m;

    access_log /var/log/nginx/homelib.access.log;
    error_log  /var/log/nginx/homelib.error.log;

    # Static files are deliberately NOT served from disk here.  /home/philippe
    # is mode 700 and nginx runs as www-data, so an alias gives 403 on every
    # asset; opening the home directory up to fix that trades the owner's
    # privacy for a few kilobytes nginx would have served marginally faster.
    # Flask hands them over instead, still gzipped and revalidated below.

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
