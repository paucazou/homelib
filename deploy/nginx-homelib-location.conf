# Homelib under http://palantir/homelib, beside the thermometer's own pages.
#
# Installed as /etc/nginx/snippets/homelib-location.conf and pulled into the
# thermo server block with a single "include" line, so the two sites stay
# separate files and neither edit can break the other.
#
# This is a second door onto the same gunicorn: port 8888 keeps answering at the
# root, because dbupdater.py on the desktop has always fetched
# http://palantir:8888/dbchecksum.py and there is no reason to make it move.
# What distinguishes the two is the X-Forwarded-Prefix header below, which the
# application turns into a WSGI SCRIPT_NAME so every URL it writes carries the
# /homelib in front.

location = /homelib { return 301 /homelib/; }

# "^~" and not a plain prefix: the thermo site has a "\.(js|css)$" regex
# location for its own assets, and a regex match wins over a prefix match.
# Without this, /homelib/static/app.js would be looked for on disk under
# /var/www/html and answered with 404.
location ^~ /homelib/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /homelib;
    proxy_read_timeout 120s;

    client_max_body_size 4m;

    # The thermo server compresses its JSON but not text/javascript, which is
    # what Flask labels app.js: unlisted, the 76 KB script goes over the wifi
    # whole.  gzip_types is set again here rather than widened up there, so the
    # thermometer keeps exactly the behaviour it had.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types application/json application/javascript text/javascript
               application/manifest+json text/css text/plain image/svg+xml;

    access_log /var/log/nginx/homelib.access.log;
    error_log  /var/log/nginx/homelib.error.log;
}
